<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <title>Femi Art — Touch of Love</title>
  <style>
    html,body{min-height:100%;margin:0;background:#f6f3ed;color:#284333}
    body{display:grid;place-items:center;font-family:Georgia,serif}
    main{text-align:center;padding:28px}
    h1{font-size:clamp(42px,10vw,74px);font-weight:400;margin:0 0 10px}
    p{font:13px/1.7 sans-serif;letter-spacing:1px}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#9f8a6e;animation:pulse 1.3s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35;transform:scale(.65)}}
  </style>
</head>
<body>
<main role="status" aria-live="polite">
  <h1>Femi Art</h1><p>TOUCH OF LOVE</p><span class="dot"></span>
  <p id="loading">Preparing your handmade experience…</p>
</main>
<script>
(async()=>{
  const count=8;
  const paths=Array.from({length:count},(_,i)=>'./site-parts/part-'+String(i+1).padStart(2,'0')+'.txt');
  try{
    const segments=await Promise.all(paths.map(async path=>{
      const response=await fetch(path,{cache:'default'});
      if(!response.ok)throw new Error(path+': '+response.status);
      return response.text();
    }));
    let html=segments.join('');
    if(!html.includes('</body>')||!html.includes('orbitGallery')||html.length<4000000)
      throw new Error('The website data was incomplete.');
    const widget='<scr'+'ipt src="./whatsapp-widget.js" defer></scr'+'ipt>';
    html=html.replace('</body>',widget+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('Femi Art could not load:',error);
    document.getElementById('loading').textContent='Could not load the website. Please refresh this page.';
  }
})();
</script>
</body>
</html>
